# Rclone Configuration Template for IDrive E2
# Location: ~/.config/rclone/rclone.conf
#
# Replace placeholders with your actual credentials from IDrive E2 dashboard

[idrive-e2]
type = s3
provider = Other
access_key_id = YOUR_IDRIVE_E2_ACCESS_KEY
secret_access_key = YOUR_IDRIVE_E2_SECRET_KEY
region = us-east-1
endpoint = https://s3.e2.wasabisys.com
bucket = media-storage
acl = private

# Performance tuning for media uploads
upload_concurrency = 5
max_retries = 5
retries = 3
skip_links = true
no_check_certificate = false

# Memory optimization
chunk_size = 10M
upload_chunk_size = 50M
upload_cutoff = 100M

# Ensure files are stored properly
force_path_style = false
list_chunk = 1000

[idrive-e2-cache]
type = s3
provider = Other
access_key_id = YOUR_IDRIVE_E2_ACCESS_KEY
secret_access_key = YOUR_IDRIVE_E2_SECRET_KEY
region = us-east-1
endpoint = https://s3.e2.wasabisys.com
bucket = media-storage
acl = private

# Use cache wrapper for faster access
cache_dir = /tmp/rclone-cache
cache_expire = 3600
cache_chunk_no_memory = true

[local-backup]
type = local
path = /backup/drive/media

[local-media]
type = local
path = /path/to/media

# Optional: Crypt wrapper for encrypted backups
[idrive-e2-crypt]
type = crypt
remote = idrive-e2:media-storage
filename_encryption = standard
directory_name_encryption = true
password = YOUR_ENCRYPTION_PASSWORD_HERE
password2 = YOUR_ENCRYPTION_SALT_HERE
