version: '3.8'

services:
  wiki:
    image: requarks/wiki:2
    container_name: wiki-js
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_TYPE: sqlite
      DB_FILEPATH: /data/wiki.sqlite
      LOG_LEVEL: info
    volumes:
      - wiki_data:/data
    networks:
      - wiki-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy for the subdomain
  # Uncomment this section if you want to use nginx for SSL/TLS and subdomain routing
  # nginx:
  #   image: nginx:alpine
  #   container_name: wiki-nginx
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - wiki
  #   networks:
  #     - wiki-network

volumes:
  wiki_data:

networks:
  wiki-network:
    driver: bridge
